<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>For Signe ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">


    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div id="login-container">

        <div class="heart">
            ♡
        </div>

        <h1>For Signe</h1>

        <p>A little something I made for you.</p> 
        Who is your animal best friend?
        </p>

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="login-button">

            Open ♥️

        </button>

        <p id="message"></p>

    </div>

    <div id="website-content">

        <div id="letter-page">

            <div class="letter-card">

                <h1>
                    For Signe ❤️
                </h1>


                <p id="letter-text">

                </p>


                <button id="continue-button">

                    Continue →

                </button>


            </div>

        </div>

        <div id="puzzle-page">

            <div class="puzzle-card">

                <h1>
                    A memory waiting to be uncovered ❤️
                </h1>


                <p>
                    Put the pieces together.
                </p>


                <div id="puzzle-container">

                </div>

                <p id="puzzle-message"></p>

                <button id="puzzle-button">
                    Continue →
                </button>

            </div>

        </div>

        

    </div>

    <script src="script.js"></script>

</body>

</html>
